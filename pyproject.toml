[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopnet"
version = "0.1.0"
description = "A tiny state-machine language compiled into a recurrent ReLU residual network"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
loopnet = "loopnet.__main__:main"

[tool.setuptools.packages.find]
include = ["loopnet*"]
